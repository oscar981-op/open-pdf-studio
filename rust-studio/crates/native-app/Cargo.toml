[package]
name = "opds-native-app"
version = "0.2.0"
edition.workspace = true
license = "GPL-3.0-only"
publish.workspace = true

[features]
dynlex-experimental = ["opds-dynlex-backend/kernel", "dep:opds-opdl-adapter"]
pdfium-experimental = ["opds-dynlex-backend/pdfium"]
own-rust-experimental = ["opds-dynlex-backend/own-rust"]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "x11", "image-without-codecs", "svg", "canvas", "advanced"] }
opds-native-core = { path = "../studio-core" }
opds-engine-probe = { path = "../engine-probe" }
opds-dynlex-backend = { path = "../dynlex-backend" }
opds-opdl-adapter = { path = "../opdl-adapter", optional = true }
lopdf = { version = "=0.34.0", default-features = false, features = ["nom_parser"] }
ttf-parser = "=0.25.1"
serde_json = "=1.0.151"
png = "=0.17.16"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
tiff = "=0.11.3"
roxmltree = "=0.20.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time"] }
