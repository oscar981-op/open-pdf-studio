[package]
name = "opds-dynlex-backend"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
kernel = []
pdfium = ["dep:opds-pdfium-backend"]
own-rust = ["dep:opds-rust-kernel"]

[dependencies]
# Syntax/metadata only; no Hayro or Vello raster calls in PageSpace.
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
opds-opdl-adapter = { path = "../opdl-adapter" }
opds-engine-probe = { path = "../engine-probe" }
opds-native-core = { path = "../studio-core" }
lopdf = { version = "=0.34.0", default-features = false, features = ["nom_parser"] }
miniz_oxide = "=0.8.9"
opds-pdfium-backend = { path = "../pdfium-backend", optional = true }
opds-rust-kernel = { path = "../rust-kernel", optional = true }
ttf-parser = "=0.25.1"
skrifa = "=0.42.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
