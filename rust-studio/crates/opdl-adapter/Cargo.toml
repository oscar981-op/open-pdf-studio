[package]
name = "opds-opdl-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lopdf = { version = "=0.34.0", default-features = false, features = ["nom_parser"] }
miniz_oxide = "=0.8.9"
pic-scale = { version = "=0.7.12", default-features = false, features = ["neon", "rdm", "sse", "avx"] }
ttf-parser = "=0.25.1"
skrifa = "=0.42.1"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std", "x86", "neon"] }
